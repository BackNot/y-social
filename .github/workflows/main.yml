name: Build and Sign

on:
  push:
    branches: [main]

jobs:
  sign:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Azure Signing Client
        run: |
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Trusted.Signing.Client" -OutFile "azuresigning.zip"
          Expand-Archive azuresigning.zip -DestinationPath azuresigning
        shell: powershell

      - name: Create metadata.json
        run: |
          $json = '{"Endpoint":"https://neu.codesigning.azure.net","CodeSigningAccountName":"${{ secrets.SIGNING_ACCOUNT_NAME }}","CertificateProfileName":"${{ secrets.CERTIFICATE_PROFILE_NAME }}","ExcludeCredentials":["VisualStudioCredential","VisualStudioCodeCredential","SharedTokenCacheCredential","InteractiveBrowserCredential"]}'
          $bytes = [System.Text.Encoding]::ASCII.GetBytes($json)
          [System.IO.File]::WriteAllBytes("metadata.json", $bytes)
        shell: powershell

      - name: Sign
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          signtool.exe sign /v /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 /dlib "azuresigning\bin\x64\Azure.CodeSigning.Dlib.dll" /dmdf "metadata.json" "test.ps1"
        shell: powershell

      - name: Verify
        run: Get-AuthenticodeSignature "test.ps1"
        shell: powershell
