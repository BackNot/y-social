name: Build and Sign

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create test artifact
        run: |
          "Write-Host 'Hello from signed script'" | Out-File "test.ps1"
        shell: powershell

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app
          path: test.ps1

  sign:
    needs: build
    uses: BackNot/signing-workflows/.github/workflows/sign-internal.yml@main
    with:
      artifact-name: my-app
      artifact-path: test.ps1
